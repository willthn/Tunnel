[project]
name = "wattshift"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.1.0",
    "fastapi[standard]>=0.159.1",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
